<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重訓肌群解剖圖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header style="display:flex;justify-content:space-between;align-items:center;">
    <div>
      <h1>重訓肌群解剖圖 💪</h1>
      <p>選一個動作看牽涉的肌群,或點人體圖上的肌肉反查練到它的所有動作</p>
    </div>
    <nav class="nav3d">
      <a href="index.html" class="active">2D</a>
      <a href="fullbody3d.html">全身</a>
      <a href="shoulder3d.html">肩</a>
      <a href="chest3d.html">胸</a>
      <a href="back3d.html">背</a>
      <a href="arm3d.html">手臂</a>
      <a href="waist3d.html">腰部</a>
      <a href="waistglute3d.html">腰臀</a>
      <a href="thigh3d.html">大腿</a>
      <a href="calf3d.html">小腿</a>
    </nav>
  </header>

  <div class="layout">
    <!-- 左:動作清單 -->
    <aside class="sidebar">
      <h3>選動作</h3>
      <div id="exercise-list"></div>
    </aside>

    <!-- 中:人體圖(前/後視圖並排) -->
    <main class="stage">
      <div id="body-container"></div>
      <div class="legend">
        <span><i class="dot primary" style="width:10px;height:10px;border-radius:50%;margin-right:6px"></i>主動肌</span>
        <span><i class="dot synergist" style="width:10px;height:10px;border-radius:50%;margin-right:6px"></i>協同肌</span>
        <span><i class="dot stabilizer" style="width:10px;height:10px;border-radius:50%;margin-right:6px"></i>穩定肌</span>
      </div>
    </main>

    <!-- 右:資訊面板 -->
    <aside class="panel-wrap">
      <div id="panel"></div>
    </aside>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
